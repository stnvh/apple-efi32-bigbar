# Ubuntu ships nvidia-persistenced with --no-persistence-mode, so the daemon
# runs and registers GPUs but never enables persistence - power limits set
# with `nvidia-smi -pl` then revert as soon as the last client exits.
# Install to /etc/systemd/system/nvidia-persistenced.service.d/override.conf
[Service]
ExecStart=
ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --verbose
